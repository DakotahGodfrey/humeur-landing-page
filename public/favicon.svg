<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Humeur">
  <!-- A split day: Great in the morning, Bad in the evening. The same 135°
       construction the calendar uses, and two of the theme-invariant mood
       swatches, so the mark means the thing the product is about.

       Matched to app/logo-1024.png rather than drawn beside it. It previously
       used Okay (green) over Bad on a 24%-radius square, so the site's mark
       and the app's icon were two different objects.

       The outline is the logo's own corner curve — a superellipse of exponent
       3 at R = 159/1024 of the width, fitted to the traced alpha edge of that
       file, sampled rather than approximated with a circular `rx`. Generated;
       regenerate from the source PNG rather than hand-editing the path.

       Colours are hsl() of the mood tokens so the source of the values is
       legible. They are theme-invariant and must stay that way. -->
  <defs>
    <linearGradient id="split" x1="0" y1="0" x2="1" y2="1">
      <stop offset="50%" stop-color="hsl(50 90% 73%)" />
      <stop offset="50%" stop-color="hsl(250 31% 56%)" />
    </linearGradient>
  </defs>
